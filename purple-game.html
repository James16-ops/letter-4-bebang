<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Purple Star</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="purple-stage">

    <div class="top-bar">
        <div id="score">⭐ Stars: 0 / 5</div>
        <div id="timer">⏳ 20</div>
    </div>

    <div class="game-title">
        <h1>OPERATION PURPLE STAR</h1>

        <p>
            The penguins stole the stars.<br>
            Catch 5 before they escape.
        </p>
    </div>

    <div class="arena">

        <div class="penguin" id="penguin1">🐧</div>

        <div class="penguin" id="penguin2">🐧</div>

        <div class="penguin holder" id="penguin3">
            ⭐
            🐧
        </div>

        <div class="penguin" id="penguin4">🐧</div>

        <div class="penguin" id="penguin5">🐧</div>

    </div>

    <button id="continueBtn" style="display:none;">
        Continue →
    </button>

    <script src="js/purple.js"></script>

</body>
</html>
